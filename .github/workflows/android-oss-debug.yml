name: Sync upstream and build Android OSS debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: android-oss-debug
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out fork
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run this workflow from main so upstream sync cannot push another branch to main."
            exit 1
          fi

      - name: Fetch upstream
        shell: bash
        run: |
          git remote add upstream https://github.com/chen2he/orange-cloud.git 2>/dev/null || true
          git fetch upstream main

      - name: Check for upstream changes
        id: upstream
        shell: bash
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge and push upstream changes
        if: steps.upstream.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit upstream/main
          git push origin HEAD:main

      - name: Set up JetBrains JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build OSS debug APK
        working-directory: apps/android
        shell: bash
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID || '' }}
          OAUTH_DOMAIN: ${{ vars.OAUTH_DOMAIN || '' }}
        run: |
          VERSION_CODE=$(($(date +%s) / 60))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          chmod +x gradlew
          ./gradlew :app:assembleOssDebug \
            -POAUTH_CLIENT_ID="$OAUTH_CLIENT_ID" \
            -POAUTH_DOMAIN="$OAUTH_DOMAIN" \
            -PBUILD_VERSION_CODE="$VERSION_CODE" \
            --no-daemon \
            --stacktrace

      - name: Restore permanent signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/orange-cloud-update.jks"

      - name: Sign APK with permanent key
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KEYSTORE_PASSWORD="$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')"
          KEY_ALIAS="$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n')"
          KEY_PASSWORD="$(printf '%s' "$KEY_PASSWORD" | tr -d '\r\n')"
          export KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD

          test -n "$KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS is missing"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD is missing"; exit 1; }

          INPUT_APK=$(find apps/android/app/build/outputs/apk/oss/debug -name '*.apk' -print -quit)
          test -n "$INPUT_APK" || { echo "OSS debug APK was not found"; exit 1; }

          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$INPUT_APK" "$RUNNER_TEMP/orange-cloud-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/orange-cloud-update.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out orange-cloud-oss-debug.apk \
            "$RUNNER_TEMP/orange-cloud-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs orange-cloud-oss-debug.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          name: orange-cloud-oss-debug-${{ env.VERSION_CODE }}
          path: orange-cloud-oss-debug.apk
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Publish APK to GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          RELEASE_TAG="oss-debug-${VERSION_CODE}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          COMMIT_SHA=$(git rev-parse HEAD)
          gh release create "$RELEASE_TAG" \
            "orange-cloud-oss-debug.apk#Orange Cloud OSS Debug APK" \
            --target "$COMMIT_SHA" \
            --title "Orange Cloud OSS Debug ${VERSION_CODE}" \
            --notes "Automated OSS debug APK. Version code: ${VERSION_CODE}. Commit: ${COMMIT_SHA}." \
            --prerelease \
            --latest=false
