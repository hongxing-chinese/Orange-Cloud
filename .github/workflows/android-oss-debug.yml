name: Sync upstream and build Android OSS debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: write

concurrency:
  group: android-oss-debug
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out fork
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/chen2he/orange-cloud.git 2>/dev/null || true
          git fetch upstream main

      - name: Check for upstream changes
        id: upstream
        shell: bash
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge and push upstream changes
        if: steps.upstream.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit upstream/main
          git push origin HEAD:main

      - name: Set up JetBrains JDK 21
        if: steps.upstream.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: "21"

      - name: Set up Gradle cache
        if: steps.upstream.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        if: steps.upstream.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build OSS debug APK
        if: steps.upstream.outputs.changed == 'true' || github.event_name != 'schedule'
        working-directory: apps/android
        shell: bash
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID || 'bb7cbe5b7f81ff5e36908db666b1d404' }}
          OAUTH_DOMAIN: ${{ vars.OAUTH_DOMAIN || 'oauth.wideseek.de5.net' }}
        run: |
          VERSION_CODE=$(($(date +%s) / 60))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          chmod +x gradlew
          ./gradlew :app:assembleOssDebug \
            -POAUTH_CLIENT_ID="$OAUTH_CLIENT_ID" \
            -POAUTH_DOMAIN="$OAUTH_DOMAIN" \
            -PBUILD_VERSION_CODE="$VERSION_CODE" \
            --no-daemon \
            --stacktrace

      - name: Restore permanent signing key
        if: steps.upstream.outputs.changed == 'true' || github.event_name != 'schedule'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/orange-cloud-update.jks"

      - name: Sign APK with permanent key
        if: steps.upstream.outputs.changed == 'true' || github.event_name != 'schedule'
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS is missing"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD is missing"; exit 1; }

          INPUT_APK=$(find apps/android/app/build/outputs/apk/oss/debug -name '*.apk' -print -quit)
          test -n "$INPUT_APK" || { echo "OSS debug APK was not found"; exit 1; }

          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$INPUT_APK" "$RUNNER_TEMP/orange-cloud-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/orange-cloud-update.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out orange-cloud-oss-debug.apk \
            "$RUNNER_TEMP/orange-cloud-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs orange-cloud-oss-debug.apk

      - name: Upload signed APK
        if: steps.upstream.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-artifact@v7
        with:
          name: orange-cloud-oss-debug-${{ env.VERSION_CODE }}
          path: orange-cloud-oss-debug.apk
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
